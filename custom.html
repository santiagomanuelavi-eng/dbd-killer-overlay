<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Killer Control</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <div class="top-accent"></div>

    <div class="panel-header">
        <h1>DBD <span>KILLER CONTROL</span></h1>
        <p>Selecciona el orden y registra el resultado</p>
    </div>

    <div class="section-divider">
        <span></span>
        <svg viewBox="0 0 24 24"><path d="M4 2 L7 22 M9 1 L12 22 M15 1 L17 22 M20 2 L22 20"/></svg>
        <span></span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabBtnKillers" onclick="showTab('killers')">LISTA DE KILLERS</button>

        <div class="menu-wrapper">
            <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7 H20 M4 12 H20 M4 17 H20"/></svg>
            </button>
            <div class="menu-dropdown" id="menuDropdown">
                <button id="menuItemSurvivor" onclick="showTab('survivor')">PERKS SURVIVOR</button>
                <button id="menuItemKillerPerks" onclick="showTab('killerperks')">PERKS KILLER</button>
                <button id="menuItemStats" onclick="showTab('stats')">ESTADÍSTICAS</button>
            </div>
        </div>
    </div>

    <div id="view-killers" class="tab-view">

        <div class="controls">

            <button onclick="randomOrder()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
                ORDEN ALEATORIO
            </button>

            <button class="btn-win" onclick="addWin()">
                <svg viewBox="0 0 24 24"><path d="M4 12 L10 18 L20 6"/></svg>
                VICTORIA
            </button>

            <button class="btn-loss" onclick="addLoss()">
                <svg viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19"/></svg>
                DERROTA
            </button>

            <button onclick="addDraw()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9 H20 M4 15 H20"/></svg>
                EMPATE
            </button>

            <button class="btn-reset" onclick="resetAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12 a8 8 0 1 1 3 6.2 M4 12 V6 M4 12 H10"/></svg>
                REINICIO TOTAL
            </button>

        </div>

        <div id="killerGrid" class="grid"></div>

    </div>

    <div id="view-survivor" class="tab-view" style="display:none;">

        <div class="perks-section">
            <div class="perks-section-header">
                <h2>PERKS SUPERVIVIENTE</h2>
                <button class="btn-roll" onclick="rollSurvivorPerks()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
                    SORTEAR BUILD
                </button>
            </div>
            <div id="survivorPerksResult" class="perks-grid"></div>
        </div>

    </div>

    <div id="view-killerperks" class="tab-view" style="display:none;">

        <div class="perks-section">
            <div class="perks-section-header">
                <h2>PERKS KILLER</h2>
                <button class="btn-roll" onclick="rollKillerPerks()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
                    SORTEAR BUILD
                </button>
            </div>
            <div id="killerPerksResult" class="perks-grid"></div>
        </div>

    </div>

    <div id="view-stats" class="tab-view" style="display:none;">

        <div class="stats-grid">

            <div class="stat-card">
                <span>VICTORIAS</span>
                <h3 id="statWins">0</h3>
            </div>

            <div class="stat-card">
                <span>DERROTAS</span>
                <h3 id="statLosses">0</h3>
            </div>

            <div class="stat-card">
                <span>EMPATES</span>
                <h3 id="statDraws">0</h3>
            </div>

            <div class="stat-card stat-card-accent">
                <span>WINRATE GLOBAL</span>
                <h3 id="statWinrate">0%</h3>
            </div>

        </div>

        <div class="stats-highlight">
            <div class="highlight-card">
                <span>KILLER MÁS USADO</span>
                <h3 id="statMostUsed">Sin datos aún</h3>
            </div>

            <div class="highlight-card">
                <span>MEJOR WINRATE INDIVIDUAL</span>
                <h3 id="statBestWinrate">Sin datos aún</h3>
            </div>
        </div>

    </div>

</div>

<script type="module" src="script.js"></script>
<script type="module" src="perks.js"></script>
<script type="module" src="stats.js"></script>

</body>
</html>
