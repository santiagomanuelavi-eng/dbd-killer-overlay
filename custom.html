<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Killer Control</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <div class="controls">

        <button onclick="randomOrder()">
            ORDEN ALEATORIO
        </button>

        <button onclick="addWin()">
            VICTORIA
        </button>

        <button onclick="addLoss()">
            DERROTA
        </button>

        <button onclick="addDraw()">
            EMPATE
        </button>

        <button onclick="resetAll()">
            REINICIO TOTAL
        </button>

    </div>

    <div id="killerGrid" class="grid"></div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
